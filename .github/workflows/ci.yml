name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Test with isolated ambient Git configuration
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: bundle exec rake test
      - name: Build and exercise installed gem
        shell: bash
        run: |
          set -euo pipefail
          gem build ci-test-plan.gemspec
          gem install --local ci-test-plan-*.gem --no-document --install-dir "$RUNNER_TEMP/test-gems"
          GEM_HOME="$RUNNER_TEMP/test-gems" "$RUNNER_TEMP/test-gems/bin/ci-test-plan" --help
